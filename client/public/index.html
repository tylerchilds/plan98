    <style>
      :root {
        --shadow: 0px 0px 2px 2px rgba(0,0,0,.25),
                  0px 0px 6px 6px rgba(0,0,0,.15),
                  0px 0px 2rem 2rem rgba(0,0,0,.05);
        --red: firebrick;
        --orange: darkorange;
        --yellow: gold;
        --green: mediumseagreen;
        --blue: dodgerblue;
        --indigo: slateblue;
        --purple: mediumpurple;
        --violet: mediumpurple;
        --gray: sienna;
      }
      html, body {
        height: 100%;
        background: rgba(255,255,255,.85);
        overscroll-behavior: none;
        transform: translateZ(0);
      }

      @keyframes lazy-fade-in {
        0% {
          opacity: 0;
          background: var(--root-theme, mediumseagreen);
        }
        100% {
          opacity: .5;
          background: white;
        }
      }

/*
      :not(:defined) {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      :not(:defined)::before {
        content: '';
        position: absolute;
        inset: 0;
        animation: lazy-fade-in 3000ms ease-in-out alternate infinite;
        width: 3.25in;
        height: 3.12in;
        opacity: .5;
        mix-blend-mode: multiply;
        margin: auto;
        background: lemonchiffon;
      }
*/



      @keyframes scale-it {
        0% {
          transform: scale(.5);
        }

        100% {
          transform: scale(2);
        }
      }



      @media screen {
        body{ overflow: auto; }
      }

      body {
      }

      body > *{
        position: relative;
        z-index: 2;
      }

      main {
        position: relative;
        height: 100%;
      }

      img {
        max-width: 100%;
        max-height: 100%;
        margin: auto;
      }

      boot-loader {
        max-width: 100%;
        margin: auto;
        pointer-events: none;
      }

      #bootloader {
        position: absolute;
        inset: 0;
        margin: auto;
        z-index: 1;
      }

      button * {
        pointer-events: none;
      }

      body[pathname$=".saga"] main {
        height: auto;
      }
    </style>

    <script>
      if (window.self !== window.top) {

        window.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            event.preventDefault()

            // Create a new keyboard event for the Escape key
            const escapeEvent = new KeyboardEvent('keydown', {
              key: 'Escape',
              code: 'Escape',
              keyCode: 27,
              which: 27,
              bubbles: true,
              cancelable: true
            });

            // Dispatch the event to the parent window
            window.parent.document.dispatchEvent(escapeEvent);
          }
        });
      }
    </script>
