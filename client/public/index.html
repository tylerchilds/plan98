    <style>
      :root {
        --shadow: 0px 0px 2px 2px rgba(0,0,0,.25),
                  0px 0px 6px 6px rgba(0,0,0,.15),
                  0px 0px 2rem 2rem rgba(0,0,0,.05);
        --red: firebrick;
        --orange: darkorange;
        --yellow: gold;
        --green: mediumseagreen;
        --blue: dodgerblue;
        --purple: mediumpurple;
      }
      html, body {
        height: 100%;
        background: rgba(255,255,255,.85);
      }

      :not(:defined) {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
        place-content: center;
      }
      :not(:defined)::before {
        content: '';
        position: absolute;
        inset: 0;
        animation: loader 3000ms ease-in-out alternate infinite;
        width: 3.25in;
        height: 3.12in;
        opacity: .5;
        mix-blend-mode: multiply;
        margin: auto;
        background: lemonchiffon;
        overflow: hidden;
        pointer-events: none;
      }

      @keyframes loader {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      @media screen {
        body{ overflow: auto; }
      }

      body > *{
        position: relative;
        z-index: 2;
      }

      main {
        position: relative;
        height: 100%;
      }

      img {
        max-width: 100%;
        max-height: 100%;
        margin: auto;
      }

      boot-loader {
        max-width: 100%;
        margin: auto;
        pointer-events: none;
      }

      #bootloader {
        position: absolute;
        inset: 0;
        margin: auto;
        z-index: 1;
      }

      button * {
        pointer-events: none;
      }
    </style>

    <script type="module">
      import { showModal, hideModal } from '@plan98/modal'
      let debug = false
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault()
          const mode = !debug ? debugMode : normalMode
          mode()
        }
      });
      function normalMode() {
        if(debug) {
          debug = false
          hideModal()
        }
      }

      function debugMode() {
        debug = true
        showModal(`
          <div style="width: 100%; height: 100%; max-width: 100vw; max-height: 100vh;">
            <div style="overflow: auto; height: 100%;">
              <source-code></source-code>
            </div>
          </div>
        `, { centered: true, onHide: normalMode })
      }

    </script>
